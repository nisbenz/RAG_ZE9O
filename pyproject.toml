[project]
name = "mcclub-rag"
version = "0.1.0"
description = "RAG chatbot for the MC Club RAG Chatbot Challenge"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi[standard]~=0.143",
    "pydantic-settings~=2.15",
    "openai>=3.27",
    "qdrant-client~=1.19",
    "fastembed>=0.9",
    "onnxruntime>=1.31",
    "tokenizers>=0.23",
    "huggingface-hub>=0.36",
    "numpy>=2.0",
    "xberg==1.3.6",
    "trafilatura~=2.3",
    "httpx~=0.28",
    "semchunk~=4.1",
    "py3langid~=0.4",
    "structlog>=26.1",
]

[dependency-groups]
dev = [
    "pytest~=9.1",
    "pytest-asyncio~=1.4",
    "ruff~=0.16",
]

[build-system]
requires = ["uv_build>=0.12.24,<0.13"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
