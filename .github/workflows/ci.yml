name: CI

on:
  push:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_VERSION: "0.12.24"
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Check uv.lock is up to date
        run: uv lock --check

      # Only the dev group: ruff comes from uv.lock without pulling the heavy runtime deps.
      - name: Ruff lint
        run: uv run --locked --only-group dev ruff check --output-format=github .

      - name: Ruff format check
        run: uv run --locked --only-group dev ruff format --check .

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --locked

      - name: Tests that run without tessdata
        run: uv run pytest -m "not ocr"

  test-ocr:
    name: Tests (needs tessdata)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TESSDATA_PREFIX: ${{ github.workspace }}/models/tessdata
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --locked

      - name: Cache OCR traineddata
        uses: actions/cache@v4
        with:
          path: models/tessdata
          key: tessdata-${{ hashFiles('scripts/download_models.py') }}

      - name: Download OCR traineddata (ara, fra, eng; sha256-verified)
        run: uv run python scripts/download_models.py --only tessdata --dest models/tessdata

      - name: Tests that need tessdata
        run: uv run pytest -m ocr
