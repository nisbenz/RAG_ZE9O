name: CI

on:
  push:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TESSDATA_PREFIX: ${{ github.workspace }}/models/tessdata
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.24"
          enable-cache: true

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Install dependencies (fails if uv.lock is stale)
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Cache OCR traineddata
        uses: actions/cache@v4
        with:
          path: models/tessdata
          key: tessdata-${{ hashFiles('scripts/download_models.py') }}

      - name: Download OCR traineddata (ara, fra, eng; sha256-verified)
        run: uv run python scripts/download_models.py --only tessdata --dest models/tessdata

      - name: Tests
        run: uv run pytest
